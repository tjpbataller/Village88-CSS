<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="description" content="This is the bootstrap activity">
        <meta charset="utf-8">
        <title>Bootstrap</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="Bootstrap.css">
    </head>
    <body>
        <nav class="navbar navbar-light bg-light">
            <div class="container">
                <a href="#" class="navbar-brand mb-0 fs-4 fw-bolder me-auto">Welcome</a>
                <div class="nav-item">
                    <a href="#" class="nav-link d-inline-block text-dark">Home</a>
                    <a href="#" class="nav-link d-inline-block text-dark">About</a>
                    <a href="#" class="nav-link d-inline-block text-dark">Contact</a>
                </div>
            </div>
        </nav>
        <section class="container-fluid">
            <div class="container">
                <div class="row">
                    <div class="col w-50 text-end mt-5">
                        <h1 class="display-1 m-0 mt-5">Bootstrap is</h1>
                        <p class="display-1 fw-bolder text-danger m-0">!Fun</p>
                        <p class="fs-5 m-0 w-75 d-inline-block">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Nostrum, adipisci molestias id aliquid possimus alias aperiam dolorem ipsam quas, distinctio assumenda quasi temporibus aspernatur consequuntur deleniti ab nam ex tempora.</p>
                    </div>
                    <div class="col">
                        <img src="sigma.png" alt="">
                    </div>
                </div>
            </div>
        </section>
        <section class="container-fluid py-5 bg-dark ">
            <div class="container px-5 w-50 text-light">
                <h2 class="mb-5">Comment here!</h2>
                <form action="#" class="row my-5">
                    <div class="mb-3 col-6">
                        <label for="firstname" class="form-label fs-5">First Name</label>
                        <input type="text" class="form-control" placeholder="Ex: Jane Doe" id="firstname">
                    </div>
                    <div class="mb-3 col-6">
                        <label for="lastname" class="form-label fs-5">Last Name</label>
                        <input type="text" class="form-control" placeholder="Ex: Boro-Boro" id="lastname">
                    </div>
                    <div class="mb-3 col-9 me-auto">
                        <label for="email" class="form-label fs-5">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Ex: jdboro@ymail.com">
                    </div>
                    <div class="mb-3 col-2">
                        <label for="gender" class="form-label fs-5">Gender</label>
                        <select id="gender" class="form-select">
                            <option value="none" selected>N/A</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="mb-3 col-12">
                        <label for="comment" class="form-label">Comment</label>
                        <textarea class="form-control" id="comment" id="" cols="30" rows="10"></textarea>
                    </div>
                    <div class="col-12 position-relative">
                        <input class="btn btn-outline-light px-5 position-absolute end-0 m-2" type="submit" value="Submit">
                    </div>
                </form>
            </div>
        </section>
    </body>
</html>
